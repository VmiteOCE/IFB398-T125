name: CI

on:
  push:
  pull_request:

jobs:

  # =========================================================
  # Server API Tests
  # =========================================================
  server-tests:
    name: Server API Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server-application

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: 'npm'
          cache-dependency-path: server-application/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm test


  # =========================================================
  # Client Production Build
  # =========================================================
  client-build:
    name: Client Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client-application

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.15.0'
          cache: 'npm'
          cache-dependency-path: client-application/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build client
        run: npm run build